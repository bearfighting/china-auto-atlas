technical_features:
- Battery integrated into chassis structure
- Referenced by BYD as part of DMO's hybrid non-load-bearing frame
advantages:
- Potentially reduces duplicated structural layers
- Can improve packaging and underbody protection
limitations:
- CTC is an architectural concept rather than a complete battery chemistry or charging technology
- Structural integration can complicate repair/replacement boundaries
- Do not treat BYD CTC and BYD CTB as synonyms without model-specific evidence
