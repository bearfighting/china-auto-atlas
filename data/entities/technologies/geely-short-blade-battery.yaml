description:
  en: Geely Auto's self-developed LFP short-blade traction-battery technology, designed around compact cell geometry,
    fast charging, durability and safety.
  zh-CN: 吉利汽车自研的磷酸铁锂短刀动力电池技术，以较短的刀片式电芯形态兼顾布置、快充、寿命与安全设计。
problem_solved:
- Improve LFP battery packaging flexibility
- Improve charging speed and cycle life
- Improve abuse tolerance and thermal safety
technical_features:
- LFP chemistry
- Short-blade cell geometry
- High-strength/high-thermal-stability separator
- Self-Fusing electrode-surface safety technology
advantages:
- More flexible pack arrangement than very long blade-cell formats
- Manufacturer reports fast charging and long cycle life
- LFP chemistry offers strong thermal stability
limitations:
- Safety and lifetime superlatives in launch material are manufacturer test claims
- LFP chemistry still trades some gravimetric energy density against many nickel-rich chemistries
- 2025 'Golden Short Blade' branding may represent product evolution; generations should not be silently merged if specs
  diverge
