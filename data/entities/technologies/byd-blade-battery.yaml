schema_version: 1
id: byd-blade-battery
type: technology
names:
  en: Blade Battery
  zh-CN: 刀片电池
category: battery
description:
  en: BYD's lithium-iron-phosphate battery system using long, blade-like cells and pack-level structural integration
    to improve packaging efficiency.
  zh-CN: 比亚迪采用长条形“刀片”电芯的磷酸铁锂电池系统，并通过电池包结构设计提高空间利用率。
problem_solved:
- Improve battery-pack space utilization
- Improve thermal stability and safety relative to higher-energy-density nickel-rich chemistries
- Provide durable LFP-based traction batteries
technical_features:
- LFP chemistry
- Long thin cell form factor
- High pack-level packaging efficiency
- Structural/honeycomb pack design
advantages:
- LFP chemistry avoids nickel and cobalt in the cathode
- Manufacturer reports strong nail-penetration thermal-safety behavior
- Packaging design can improve usable pack volume
limitations:
- LFP generally has lower cell-level energy density than high-nickel NMC chemistries; pack design can offset but does
  not eliminate that chemistry-level trade-off
- Nail-penetration performance is a safety test result, not proof that a complete vehicle battery is immune to fire in
  all crash or abuse conditions
