description:
  en: BYD electric-centric plug-in-hybrid off-road architecture combining a dedicated hybrid engine, electric drive,
    Blade Battery and chassis/battery integration for off-road vehicles.
  zh-CN: 比亚迪面向越野车型的电驱导向插电混动架构，将混动专用发动机、电驱、刀片电池以及底盘/电池集成结合。
problem_solved:
- Provide strong low-speed and multi-axle electric torque for off-road use
- Combine off-road capability with daily hybrid efficiency
- Package battery protection into a body-on-frame/off-road architecture
technical_features:
- Electric-centric hybrid architecture
- 1.5T engine applications
- Multi-motor capability
- Blade Battery
- Integrated CTC battery chassis in official DMO description
advantages:
- Electric motors provide controllable low-speed torque
- Hybrid energy supply reduces dependence on charging during long remote trips
limitations:
- Complex and heavy relative to simpler ICE or BEV drivetrains
- Efficiency and capability vary substantially by vehicle implementation; DMO is not a single fixed specification
