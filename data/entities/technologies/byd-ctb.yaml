description:
  en: BYD structural-integration approach in which the battery system contributes to the vehicle body's structure instead
    of remaining only a separately packaged energy-storage component.
  zh-CN: 比亚迪将电池系统进一步参与车身结构承载的电池车身一体化方案，而不只是把电池作为独立封装的储能部件。
problem_solved:
- Reduce duplicated battery/body structure
- Improve packaging efficiency
- Increase body structural stiffness
technical_features:
- Battery integrated with body structure
- Battery system serves both energy and structural roles
advantages:
- Potentially improves space utilization
- Manufacturer reports higher torsional stiffness and stronger integrated body structure
limitations:
- Greater structural integration can make battery/body repair separation more complex after severe damage
- A CTB label does not by itself specify cell chemistry, charging voltage or charging speed
