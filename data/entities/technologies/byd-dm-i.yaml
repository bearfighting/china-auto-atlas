  zh-CN: DM-i 超级混动
category: powertrain
description:
  en: BYD plug-in hybrid architecture optimized around electric drive and low fuel consumption, combining a traction
    battery, electric motor system and dedicated high-efficiency gasoline engine.
  zh-CN: 比亚迪以电驱和低油耗为主要目标的插电式混合动力体系，将动力电池、电机系统与高效率专用汽油发动机组合。
problem_solved:
- Reduce fuel consumption in plug-in hybrids
- Allow substantial electric driving while retaining liquid-fuel range
- Use the engine efficiently rather than making it the dominant traction source in all conditions
technical_features:
- Plug-in hybrid
- Electric-centric operating strategy
- Dedicated hybrid engine
- Traction battery
advantages:
- Can combine EV-like urban operation with long-distance refueling convenience
- Manufacturer reports low depleted-battery fuel consumption
limitations:
- Still carries both combustion and electric powertrains, adding mass and mechanical/system complexity compared with
  a BEV
- Fuel-consumption and total-range headline figures depend strongly on test cycle, battery SOC and model
