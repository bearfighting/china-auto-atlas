- powertrain
description:
  en: ZEEKR high-voltage ecosystem integrating 800V-class battery, electric-drive/control and charging/energy infrastructure
    technologies.
  zh-CN: 极氪围绕800V级电池、电驱/控制以及充电与能源基础设施形成的高压电动技术体系。
problem_solved:
- Increase charging-power headroom
- Improve high-power electric-drive efficiency
- Coordinate vehicle and charging infrastructure around a common high-voltage architecture
technical_features:
- 800V-class vehicle systems
- Integrated battery/controller/drive-system production context
- Fast-charging ecosystem
advantages:
- Lower current at equal power can reduce resistive losses and cable/conductor burden
- Supports high charging rates when paired with compatible battery and charger
limitations:
- 800V is not itself a charging-rate guarantee
- Benefits vary by vehicle, battery, charger availability and thermal conditions
- The '3×800V' label is manufacturer terminology rather than an industry-standard architecture definition
