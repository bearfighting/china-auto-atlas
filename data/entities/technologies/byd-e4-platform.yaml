problem_solved:
- Independent wheel-torque control
- Vehicle maneuverability and stability when traction differs by wheel
- High-output electrified propulsion for premium/off-road applications
technical_features:
- Four-motor distributed drive
- Independent wheel torque control
- Integrated perception, decision and execution control
advantages:
- Fine-grained wheel-torque control enables unusual maneuvering and traction-control strategies
- Redundancy of multiple drive units can support special control modes
limitations:
- Four drive motors increase component count, mass, cost and control complexity
- Special maneuvers do not imply improved efficiency in ordinary driving
